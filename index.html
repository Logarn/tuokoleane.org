<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse practical ways to give, share and care with Tuokoleane Initiative."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        const storageKey = "ti-theme-preference-v1";
        let preference = "light";

        try {
          const storedPreference = window.localStorage.getItem(storageKey);
          if (storedPreference === "system" || storedPreference === "light" || storedPreference === "dark") preference = storedPreference;
        } catch {}

        const systemIsDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? false;
        const resolvedTheme = preference === "system" ? (systemIsDark ? "dark" : "light") : preference;
        const root = document.documentElement;
        root.dataset.theme = resolvedTheme;
        root.dataset.themePreference = preference;
        root.style.colorScheme = resolvedTheme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", resolvedTheme === "dark" ? "#101219" : "#ffffff");
      })();
    </script>
    <meta name="application-name" content="Tuokoleane" />
    <meta name="apple-mobile-web-app-title" content="Tuokoleane" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Catalogue of Kindness | Tuokoleane Initiative</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
